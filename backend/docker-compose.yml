services:
  db:
    image: postgres:16
    container_name: neurachat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neurachat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neurachat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neurachat_pgdata:/var/lib/postgresql/data

volumes:
  neurachat_pgdata:
